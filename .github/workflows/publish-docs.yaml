name: Publish docs.k8ssandra.io

on:
  push:
    tags:
      - 'docs-v*.*.*'
      - 'docs-v*.*.*-*'
      - 'v*.*.0'

jobs:
  build_and_publish:
    name: Build and publish docs.k8ssandra.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs
    steps:
    - uses: actions/checkout@v7
      name: Checkout code w/ submodules
      with:
        submodules: recursive
    - uses: google-github-actions/auth@v3
      name: Authenticate to Google Cloud
      with:
        credentials_json: ${{ secrets.GCP_DOCS_PROD_SA_KEY }}
    - uses: google-github-actions/setup-gcloud@v3
      name: Setup gcloud
      with:
        project_id: ${{ secrets.GCP_DOCS_PROD_PROJECT_ID }}
    - uses: actions/setup-node@v7
      name: Setup Node
      with:
        node-version: 20.x
    - run: npm install
    - run: npm run clean
    - run: npm run build:production
    - run: npm run deploy:production
    - name: Purge CDN Cache
      env:
        ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        BEARER_TOKEN: ${{ secrets.CF_BEARER_TOKEN }}
      run: |
        curl -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
          -H "Authorization: Bearer ${BEARER_TOKEN}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
